name: Process Pending EduTap Calls

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

concurrency:
  group: edutap-call-processing
  cancel-in-progress: false

jobs:
  process-calls:
    runs-on: ubuntu-latest
    timeout-minutes: 65

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Process pending calls
        env:
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          OPENAI_REASONING_EFFORT: ${{ secrets.OPENAI_REASONING_EFFORT }}
          OPENAI_PROCESSING_MODE: ${{ secrets.OPENAI_PROCESSING_MODE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
          ERROR_RECIPIENT_EMAILS: ${{ secrets.ERROR_RECIPIENT_EMAILS }}
          COST_REPORT_RECIPIENT_EMAILS: ${{ secrets.COST_REPORT_RECIPIENT_EMAILS }}
          OPENAI_INPUT_PRICE_PER_1M: ${{ secrets.OPENAI_INPUT_PRICE_PER_1M }}
          OPENAI_OUTPUT_PRICE_PER_1M: ${{ secrets.OPENAI_OUTPUT_PRICE_PER_1M }}
          OPENAI_CACHED_INPUT_PRICE_PER_1M: ${{ secrets.OPENAI_CACHED_INPUT_PRICE_PER_1M }}
          OPENAI_BATCH_DISCOUNT: ${{ secrets.OPENAI_BATCH_DISCOUNT }}
          MAX_PARALLEL_CALLS: ${{ secrets.MAX_PARALLEL_CALLS }}
          MAX_JOBS_PER_RUN: ${{ secrets.MAX_JOBS_PER_RUN }}
        run: python worker.py

      - name: Schedule next polling run if needed
        if: always()
        env:
          GH_ACTIONS_TOKEN: ${{ secrets.GH_ACTIONS_TOKEN }}
        run: |
          if [ -f needs_polling.txt ] && [ "$(cat needs_polling.txt)" = "yes" ]; then
            echo "OpenAI batch still pending. Waiting 15 minutes before next polling run..."
            sleep 840
            echo "Triggering next polling run..."
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/process-calls.yml/dispatches" \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_ACTIONS_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -d '{"ref":"main"}')
            if [ "$RESPONSE" = "204" ]; then
              echo "Next polling run triggered successfully."
            else
              echo "Trigger returned HTTP $RESPONSE."
            fi
          else
            echo "No pending OpenAI batches or jobs. Polling chain stopped."
          fi
